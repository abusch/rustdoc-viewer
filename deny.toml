# Dependency policy, checked in CI by cargo-deny.

[graph]
# Only the targets we actually build and ship. Without this, cargo-deny
# also evaluates Windows crates we never compile.
targets = [
  "x86_64-unknown-linux-gnu",
  "aarch64-unknown-linux-gnu",
  "x86_64-apple-darwin",
  "aarch64-apple-darwin",
]

[advisories]
version = 2
# Both are "unmaintained" notices rather than vulnerabilities, and both come
# in transitively through syntect's dump-load/yaml-load features, which we
# cannot drop without losing syntax and theme loading. No upgrade exists.
# Revisit whenever syntect cuts a release that moves off them.
ignore = [
  "RUSTSEC-2024-0320", # yaml-rust, via syntect
  "RUSTSEC-2025-0141", # bincode, via syntect
]

[licenses]
version = 2
# Derived from the current dependency tree. Add entries as new
# dependencies need them; cargo-deny warns about unused allowances.
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "Unicode-3.0",
  "Unlicense",
  "Zlib",
  "BSL-1.0",
  "0BSD",
]

[bans]
# Duplicate transitive versions are common with syntect/ratatui and are
# not something we can fix, so warn rather than fail.
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
